[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peyk"
version = "0.1.0"
description = "Right-size local LLMs to your hardware — recommend the best current models a machine can actually run."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "fmelihh" }]
keywords = ["llm", "local-llm", "gguf", "ollama", "hardware", "inference", "recommender", "on-prem", "edge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware",
]
dependencies = [
    "pydantic>=2.5",
    "psutil>=5.9",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/fmelihh/peyk"
Repository = "https://github.com/fmelihh/peyk"
Issues = "https://github.com/fmelihh/peyk/issues"

[project.optional-dependencies]
hf = ["huggingface_hub>=0.24"]
nvidia = ["pynvml>=11.5"]
dev = ["pytest>=8.0", "pytest-mock>=3.12", "ruff>=0.6", "mypy>=1.8"]

[project.scripts]
peyk = "peyk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
peyk = ["sources/data/*.json", "benchmarks/data/*.json", "scripts/*.sh", "scripts/*.ps1", "py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["B008"]  # argparse/default-call patterns are fine here

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E741"]  # short loop vars in tests are fine
