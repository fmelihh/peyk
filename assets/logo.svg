<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="560" height="160" role="img" aria-label="peyk">
  <defs>
    <linearGradient id="peykGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="peykText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- emblem -->
  <g>
    <rect x="20" y="20" width="120" height="120" rx="30" fill="url(#peykGrad)"/>
    <!-- motion trail -->
    <g stroke="#ffffff" stroke-linecap="round" stroke-opacity="0.55">
      <line x1="30" y1="58" x2="58" y2="58" stroke-width="6"/>
      <line x1="30" y1="80" x2="50" y2="80" stroke-width="6"/>
      <line x1="30" y1="102" x2="44" y2="102" stroke-width="6"/>
    </g>
    <!-- courier: paper plane delivering the news -->
    <g transform="translate(46,44) scale(3.05)">
      <path d="M2 21 L23 11 L2 1 L2 8.4 L15 11 L2 13.6 Z" fill="#ffffff"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="168" y="96" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="82" font-weight="800" letter-spacing="-3" fill="url(#peykText)">peyk</text>
  <text x="171" y="126" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="20" font-weight="500" letter-spacing="0.2" fill="#94a3b8">know what runs &#8212; before you download</text>
</svg>
