name: Release

# Publishes to PyPI on a version tag (e.g. v0.1.0) via trusted publishing.
# One-time setup: add peyk as a PyPI "pending publisher" (project: peyk,
# workflow: release.yml, environment: pypi). No API token needed.

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # OIDC for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
